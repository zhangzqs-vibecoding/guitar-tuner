<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>吉他调音器 - Guitar Tuner</title>
  <link rel="stylesheet" href="css/style.css?v=1.6.0">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>吉他调音器</h1>
      <p class="subtitle">Guitar Tuner</p>
    </header>

    <!-- 调弦模式选择 -->
    <div class="tuning-selector">
      <label for="tuningMode">调弦模式</label>
      <select id="tuningMode">
        <option value="standard">Standard (标准)</option>
        <option value="dropD">Drop D</option>
        <option value="openG">Open G</option>
        <option value="openD">Open D</option>
        <option value="dadgad">DADGAD</option>
        <option value="halfStepDown">Half Step Down (降半音)</option>
        <option value="wholeStepDown">Whole Step Down (降全音)</option>
        <option value="dropC">Drop C</option>
      </select>
    </div>

    <!-- 弦选择器 -->
    <div class="string-selector" id="stringSelector">
      <!-- 动态生成 -->
    </div>

    <!-- Auto 模式切换 -->
    <div class="auto-toggle-row">
      <button class="auto-toggle" id="autoToggle" onclick="toggleAutoMode()">
        <span class="auto-icon">⟳</span>
        <span>Auto 自动识别</span>
      </button>
    </div>

    <!-- 波形显示 -->
    <div class="waveform-container">
      <canvas id="waveform" class="waveform-canvas"></canvas>
    </div>

    <!-- 频谱显示 -->
    <div class="spectrum-container">
      <canvas id="spectrum" class="spectrum-canvas"></canvas>
    </div>

    <!-- 信号强度 -->
    <div class="signal-meter">
      <div class="signal-bar" id="signalBar"></div>
    </div>

    <!-- 音高指示表盘 -->
    <div class="meter-container">
      <div class="meter-scale">
        <span>-50¢</span>
        <span>-20¢</span>
        <span>0¢</span>
        <span>+20¢</span>
        <span>+50¢</span>
      </div>
      <div class="meter" id="meter">
        <div class="meter-target"></div>
        <div class="meter-needle" id="needle"></div>
        <div class="meter-bar" id="meterBar">
          <div class="meter-fill" id="meterFill"></div>
        </div>
      </div>
    </div>

    <!-- 检测到的音符显示 -->
    <div class="note-display">
      <div class="note-name" id="noteName">--</div>
      <div class="note-cents" id="noteCents">0 ¢</div>
    </div>

    <!-- 频率显示 -->
    <div class="freq-display" id="freqDisplay">
      频率: -- Hz
    </div>

    <!-- 状态信息 -->
    <div class="status-bar" id="statusBar">
      <span class="status-dot"></span>
      <span id="statusText">等待麦克风授权...</span>
    </div>

    <!-- 启动按钮 -->
    <button class="start-btn" id="startBtn" onclick="startTuner()">
      开始调音
    </button>

    <!-- 版本号 -->
    <div class="version">v1.6.0</div>
  </div>

  <script src="js/tunings.js?v=1.6.0"></script>
  <script src="js/tuner.js?v=1.6.0"></script>
  <script src="js/app.js?v=1.6.0"></script>
</body>
</html>
